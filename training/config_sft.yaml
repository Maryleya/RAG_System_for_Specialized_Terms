name: sft-training
desc: SFT training with glossary in prompt — LoRA r=64, alpha=128, 2 epochs, lr=1e-4
cmd: python3 train_sft.py
  --model tencent/Hy-MT2-7B
  --data ${DATA}
  --output ${OUTPUT}
  --epochs 2
  --lr 1e-4
  --lora-r 64
  --lora-alpha 128
  --trust-remote-code
env:
  python:
    type: manual
    version: 3.10
    requirements-file: requirements.txt
inputs:
  - sft_train.json: DATA
outputs:
  - sft_lora: OUTPUT
cloud-instance-types:
  - g2.1
